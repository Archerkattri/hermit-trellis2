    <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.muted{fill:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#111827;stroke:#334155;stroke-width:1.5}</style>
